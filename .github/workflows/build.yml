name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install frontend deps
        run: pnpm install

      - name: Download yt-dlp sidecar (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p src-tauri/binaries
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o src-tauri/binaries/yt-dlp
          chmod +x src-tauri/binaries/yt-dlp

      - name: Download yt-dlp sidecar (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o src-tauri/binaries/yt-dlp.exe

      - name: Download FFmpeg sidecar (Linux)
        if: matrix.platform == 'linux'
        run: |
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg src-tauri/binaries/ffmpeg
          chmod +x src-tauri/binaries/ffmpeg
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

      - name: Download FFmpeg sidecar (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip -o ffmpeg.zip
          unzip ffmpeg.zip
          cp ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe src-tauri/binaries/ffmpeg.exe
          rm -rf ffmpeg.zip ffmpeg-master-latest-win64-gpl

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'YT Downloader ${{ github.ref_name }}'
          releaseBody: |
            ## YT Downloader ${{ github.ref_name }}

            ### Pobierz / Download
            - **Windows**: plik `.msi` lub `.exe`
            - **Linux**: plik `.deb` lub `.AppImage`

            ### Wymagania / Requirements
            - Windows 11 (64-bit)
            - Ubuntu 22.04+ (64-bit)

            yt-dlp i FFmpeg są dołączone — nie wymagają osobnej instalacji.
          releaseDraft: true
          prerelease: false
